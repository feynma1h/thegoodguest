# Environment variables for the roomstudio bundle ingester on Cloud Run.
# Passed via --env-vars-file in infra/deploy_api.sh.
#
# All vars below are required when ENVIRONMENT=production (enforced by
# the startup lifespan handler in services/api/server.py). A missing or empty
# var causes the container to fail its startup probe and the deploy to roll back.

ENVIRONMENT: production

FIRESTORE_PROJECT: roomstudio
CLOUD_TASKS_PROJECT: roomstudio
CLOUD_TASKS_LOCATION: asia-southeast1
CLOUD_TASKS_QUEUE: perception-dispatch
CLOUD_TASKS_INVOKER_SA: tasks-invoker@roomstudio.iam.gserviceaccount.com
PERCEPTION_OBJ_PROCESS_URL: https://perception-obj-q62kcditqa-as.a.run.app/process

# GCS bucket where iOS captures are uploaded. Used by /upload_session to mint
# resumable URIs and by /ingest/eventarc for the blob existence check.
GCS_CAPTURES_BUCKET: roomstudio-captures
