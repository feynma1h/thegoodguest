# Environment variables for the roomstudio internal API on Cloud Run.
# Passed via --env-vars-file in infra/deploy_api_internal.sh.
#
# Required in production and enforced at startup (_PRODUCTION_REQUIRED_VARS in
# services/api-internal/ingest_server.py): FIRESTORE_PROJECT,
# CLOUD_TASKS_PROJECT, CLOUD_TASKS_LOCATION, CLOUD_TASKS_QUEUE,
# CLOUD_TASKS_INVOKER_SA, PERCEPTION_OBJ_PROCESS_URL. ENVIRONMENT=production is
# what arms that check. Everything else in this file is an explicit override of
# a code default; the per-var comments say which.
#
# GCS_CAPTURES_BUCKET is intentionally absent: the ingest path extracts
# the bucket from the incoming GCS URI and never reads this env var.

ENVIRONMENT: production

FIRESTORE_PROJECT: roomstudio
CLOUD_TASKS_PROJECT: roomstudio
CLOUD_TASKS_LOCATION: asia-southeast1
CLOUD_TASKS_QUEUE: perception-dispatch
CLOUD_TASKS_INVOKER_SA: tasks-invoker@roomstudio.iam.gserviceaccount.com
PERCEPTION_OBJ_PROCESS_URL: https://perception-obj-q62kcditqa-as.a.run.app/process

# Retention for terminal-failure scenes (gap F6, decision 0086): update_status
# stamps scenes.expire_at = now + this many days on failed / failed_invalid /
# failed_incomplete, and the Firestore TTL policy (eventarc_setup.sh
# --scenes-ttl-only) sweeps past deadlines. Ready scenes are never stamped.
# Optional (code default 90); listed here so the knob is discoverable.
SCENES_FAILED_TTL_DAYS: "90"
