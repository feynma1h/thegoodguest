# Cloud Build configuration for perception-obj.
#
# Invoked by infra/deploy_perception.sh obj from the REPO ROOT.
# The build context is the repo root (same as the api service) so that
# packages/schemas/ is reachable from the Dockerfile.  .gcloudignore at the
# repo root excludes test_data/ and other large non-build paths, keeping the
# upload small.
#
# Two steps:
#   1. Download the pre-built pytorch3d wheel from GCS into /workspace/wheels/.
#      (Compiled once by infra/build_pytorch3d_wheel.sh; avoids a 30-50 min
#      compile during every build.)
#   2. Build the image with buildx so the HF token secret can be mounted
#      into a RUN step without baking it into a layer, and so the layer cache
#      can be written as a registry cache that survives being used
#      (decision 0199). buildx pushes the image itself.

steps:
  # ── Step 1: download cached pytorch3d wheel ──────────────────────────────
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        mkdir -p /workspace/wheels
        gsutil cp "gs://thegoodguest-build-cache/wheels/pytorch3d-*.whl" /workspace/wheels/
        ls -la /workspace/wheels/

  # ── Step 2: build image and push it (repo root is the build context) ─────
  # Layer cache: a REGISTRY cache at the stable `:buildcache` ref, written by
  # buildx with `mode=max`, and the build pushes the image itself rather than
  # leaving it for a later `docker push` step (the docker-container driver
  # keeps nothing in the local daemon).
  #
  # The predecessor here was `docker build --cache-from :buildcache
  # --build-arg BUILDKIT_INLINE_CACHE=1`, and it self-destructed on a
  # two-build cycle: the inline exporter writes cache records only for the
  # layers a build actually EXECUTED, so a build that rode the cache
  # published a cache missing every layer it had reused, and the build after
  # it rebuilt from `apt-get` down. Measured over seven production builds and
  # reproduced causally on a three-layer probe — cold 27 s, hit 2 s, then
  # 28 s off the hit's own cache. Decision 0199 carries both, and 0182's
  # unexplained step-8 miss was this.
  #
  # `mode=max` is what makes the export complete; the registry exporter also
  # re-publishes records it imported, which is the half inline cannot do. The
  # docker-container driver is required — the default `docker` driver cannot
  # write `type=registry` cache at all.
  #
  # `--provenance=false --sbom=false` is load-bearing, not tidiness. buildx
  # attaches an attestation by default, which makes the pushed artifact an
  # OCI INDEX over {real image, attestation} — so the timestamped tag names
  # the index while Cloud Run resolves and pins the CHILD manifest, which
  # carries no tag. Decision 0190 protects the live image BY TAG, and
  # move_serving_tag in deploy_perception.sh tags `${_IMAGE_URI}`; together
  # those would tag the index and leave the digest the GPU service actually
  # boots from untagged and deletable. Single-manifest keeps tag and pinned
  # digest the same object, which is what 0190 assumes. Decision 0200.

  # `:buildcache` now holds a cache manifest rather than a runnable image.
  # Nothing deploys it, and decision 0190's cleanup policy keeps it by TAG,
  # so it stays protected. A missing or unreadable `:buildcache` fails only
  # the import — the log shows `ERROR: ... not found` — and the build
  # proceeds uncached and re-seeds it, which is expected, not a failure.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        echo "$$HF_TOKEN" > /tmp/hf_token.txt
        docker buildx create --name rsbuilder --driver docker-container --use
        docker buildx build \
          --provenance=false --sbom=false \
          --secret id=hf_token,src=/tmp/hf_token.txt \
          --cache-from "type=registry,ref=${_CACHE_URI}" \
          --cache-to "type=registry,ref=${_CACHE_URI},mode=max" \
          -t "${_IMAGE_URI}" \
          --push \
          -f services/perception-obj/Dockerfile \
          .
        rm /tmp/hf_token.txt
    secretEnv: ['HF_TOKEN']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/hf-token/versions/latest
      env: 'HF_TOKEN'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: 5400s

substitutions:
  _IMAGE_URI: ''
  # Stable cache tag in the same repo as the deploy images. Literal (not
  # derived from the deploy script's variables) so a bare
  # `gcloud builds submit --config` without extra substitutions still
  # caches; override alongside _IMAGE_URI if the repo/region ever moves.
  _CACHE_URI: 'asia-southeast1-docker.pkg.dev/thegoodguest/thegoodguest/perception-obj:buildcache'
