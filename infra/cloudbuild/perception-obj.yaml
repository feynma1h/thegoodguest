# Cloud Build configuration for perception-obj.
#
# Invoked by infra/deploy_perception.sh obj from the REPO ROOT.
# The build context is the repo root (same as the api service) so that
# packages/schemas/ is reachable from the Dockerfile.  .gcloudignore at the
# repo root excludes test_data/ and other large non-build paths, keeping the
# upload small.
#
# Two steps before the docker build:
#   1. Download the pre-built pytorch3d wheel from GCS into /workspace/wheels/.
#      (Compiled once by infra/build_pytorch3d_wheel.sh; avoids a 30-50 min
#      compile during every build.)
#   2. Build the image with BuildKit so the HF token secret can be mounted
#      into a RUN step without baking it into a layer.

steps:
  # ── Step 1: download cached pytorch3d wheel ──────────────────────────────
  - name: 'gcr.io/cloud-builders/gsutil'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        mkdir -p /workspace/wheels
        gsutil cp "gs://roomstudio-build-cache/wheels/pytorch3d-*.whl" /workspace/wheels/
        ls -la /workspace/wheels/

  # ── Step 2: build image (repo root is the build context) ─────────────────
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -euo pipefail
        export DOCKER_BUILDKIT=1
        echo "$$HF_TOKEN" > /tmp/hf_token.txt
        docker build \
          --secret id=hf_token,src=/tmp/hf_token.txt \
          -t "${_IMAGE_URI}" \
          -f services/perception-obj/Dockerfile \
          .
        rm /tmp/hf_token.txt
    secretEnv: ['HF_TOKEN']

  # ── Step 3: push ──────────────────────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_URI}']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/hf-token/versions/latest
      env: 'HF_TOKEN'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: 5400s

images:
  - '${_IMAGE_URI}'

substitutions:
  _IMAGE_URI: ''
