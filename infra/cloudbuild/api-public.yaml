# Cloud Build configuration for the roomstudio public API (services/api-public/).
#
# Invoked by infra/deploy_api_public.sh. Builds from repo root so that
# packages/schemas/ and packages/api-core/ are reachable by the Dockerfile.
#
# No GPU, no HF token, no pytorch3d wheel — this is a pure-Python FastAPI
# service. Build time is ~2-4 min on the first run; faster after Docker
# layer caching.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --tag
      - '${_IMAGE_URI}'
      - --file
      - services/api-public/Dockerfile
      - .   # repo root is the build context

  # Smoke-test: verify protobuf gencode/runtime compatibility before pushing.
  # Catches the class of failure in docs/decisions/0021 (layer-order bug that
  # let proto-plus downgrade protobuf back to 6.x after the force-reinstall).
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - run
      - --rm
      - '${_IMAGE_URI}'
      - python
      - -c
      - |
        from thegoodguest_schemas import CaptureBundle, CaptureTier
        from thegoodguest_api_core.scene import Scene
        print("import smoke: OK")

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_URI}']

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 20

timeout: 600s   # 10 min; enough for pip + small image, no model weights

images:
  - '${_IMAGE_URI}'

substitutions:
  _IMAGE_URI: ''
