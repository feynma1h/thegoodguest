# Cloud Build configuration for the roomstudio bundle ingester (services/api/).
#
# Invoked by infra/deploy_api.sh. Builds a CPU-only container from repo root
# (the build context includes packages/schemas/ so the Dockerfile can install
# it) and pushes to Artifact Registry.
#
# No GPU, no HF token, no pytorch3d wheel — this is a pure-Python FastAPI
# service. Build time is ~2-4 min on the first run (pip downloads); subsequent
# runs are faster due to Docker layer caching.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --tag
      - '${_IMAGE_URI}'
      - --file
      - services/api/Dockerfile
      - .   # repo root is the build context

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_URI}']

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 20

timeout: 600s   # 10 min; enough for pip + small image, no model weights

images:
  - '${_IMAGE_URI}'

substitutions:
  _IMAGE_URI: ''
