# Cloud Build configuration for perception-geom.
#
# Invoked by infra/deploy_perception.sh geom. Builds the container with
# BuildKit (so the HF token secret can be mounted into a RUN step) and
# pushes to Artifact Registry.

steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        export DOCKER_BUILDKIT=1
        echo "$$HF_TOKEN" > /workspace/hf_token.txt
        docker build \
          --secret id=hf_token,src=/workspace/hf_token.txt \
          -t "${_IMAGE_URI}" \
          .
        rm /workspace/hf_token.txt
    secretEnv: ['HF_TOKEN']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_URI}']

availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/hf-token/versions/latest
      env: 'HF_TOKEN'

options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100

timeout: 5400s

images:
  - '${_IMAGE_URI}'

substitutions:
  _IMAGE_URI: ''
