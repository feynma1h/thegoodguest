# Environment variables for the thegoodguest public API on Cloud Run.
# Passed via --env-vars-file in infra/deploy_api_public.sh.
#
# Required in production and enforced at startup (_PRODUCTION_REQUIRED_VARS in
# services/api-public/public_server.py): FIRESTORE_PROJECT, GCS_CAPTURES_BUCKET,
# PERCEPTION_OUTPUTS_BUCKET, plus ANTHROPIC_API_KEY — which is not set here but
# mounted from Secret Manager by deploy_api_public.sh. ENVIRONMENT=production is
# what arms that check. Everything else in this file is an explicit override of
# a code default; the per-var comments say which.

ENVIRONMENT: production

FIRESTORE_PROJECT: thegoodguest

# GCS bucket where iOS captures are uploaded. Used by /upload_session to mint
# resumable URIs for the iOS client.
GCS_CAPTURES_BUCKET: thegoodguest-captures

# Bucket holding scenes/{scene_id}/** perception artifacts. Read ONLY by
# DELETE /account (decision 0095) — the assets route uses each scene's
# recorded result_uri instead, so this is the one place the outputs bucket is
# named by config rather than by data. Required in production and enforced at
# startup: a missing or wrong value would let deletion report success while
# every reconstruction survives.
PERCEPTION_OUTPUTS_BUCKET: thegoodguest-perception-outputs

# Browser origins allowed to call this API (the web app). Comma-separated.
# Unset/empty disables CORS entirely; native clients are unaffected either
# way. localhost:3000 is the Next.js dev server; the two Firebase Hosting
# domains are the web app's production homes.
#
# The thegoodguest--preview-* entry is the standing preview channel. Its host is
# stable across redeploys of the same channel but NOT across channels — a new
# channel name mints a new origin and needs this list updated, or its
# preflights 400 with no ACAO. Added 2026-08-08 so the preview channel can
# sign in.
CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://thegoodguest.web.app,https://thegoodguest.firebaseapp.com,https://thegoodguest--preview-cydkerk6.web.app"

# Conversation stage 1 (decision 0058). The guest model is env-swappable —
# NOTE: changing GUEST_MODEL moves the guest's voice more than prompt edits
# do; re-run the voice eval suite (tests/test_guest_voice_evals.py) on any
# change here. ANTHROPIC_API_KEY is NOT in this file — it's mounted from
# Secret Manager via --set-secrets in deploy_api_public.sh.
GUEST_MODEL: "claude-sonnet-5"

# Per-conversation daily turn quota (UTC day roll). Part of the closed-form
# per-scene-daily spend bound.
GUEST_DAILY_TURNS: "100"

# Bounded pool size for concurrent GCS resumable-URI mints in /upload_session
# (packages/api-core upload_session_repo._mint_all; code default 16). Raised
# 16 -> 64 for the longest real capture: a ~2,200-path LiDAR+RoomPlan manifest
# (700+ keyframes) measured >120 s at 16 — past both the client timeout and
# this service's --timeout=120 — while ~1,200 paths fit. Each mint is one small
# IO-bound POST to GCS; 64 keeps the longest realistic walk well inside the
# envelope.
UPLOAD_SESSION_MINT_CONCURRENCY: "64"

# Per-UID daily mint quota for /upload_session (gap b, decisions 0015/0087).
# One unit = one call that actually mints; idempotent replays are free. The
# heaviest observed developer day stays under ~25; the deployed iOS build
# treats a 429 as terminal (0038's Retry-After branch is a client follow-up),
# so keep this comfortably above real use. Optional (code default 50).
UPLOAD_SESSION_DAILY_MINTS: "50"

# Per-UID daily CAPTURE ceiling — the GPU-cost analogue of the mint quota
# (decision 0097). Charged once per bundle_id on its first claim, so re-mints
# of a capture already started today are free. Measured basis: one /process
# request is capped at 900 GPU-seconds, 44 long requests over 30 days averaged
# 728 s, and a capture typically needs two requests to reach `ready`.
# Optional (code default 12). Raising this raises the worst-case GPU bill per
# account proportionally — re-read 0097 before changing it.
UPLOAD_SESSION_DAILY_CAPTURES: "12"

# Manifest caps (gaps c + F3, decision 0087; code defaults shown). Largest
# real manifest to date: 2,170 paths / ~517 MB. Optional overrides — listed
# here so the knobs are discoverable:
#   UPLOAD_SESSION_MAX_PATHS: "6000"
#   UPLOAD_SESSION_MAX_BLOB_BYTES: "104857600"     # 100 MiB per blob
#   UPLOAD_SESSION_MAX_TOTAL_BYTES: "8589934592"   # 8 GiB per manifest
