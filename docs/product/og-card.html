<!DOCTYPE html>
<!--
  og-card.html — the source for web/public/og-card.png, the site-wide Open
  Graph share image (1200×630). Read by a human re-exporting the card; no
  build step consumes it.

  Provenance: authored in Claude Design (2026-08-12) from a brief carrying
  the Good Guest tokens (web/src/app/globals.css) and real geometry, then
  flattened here from the .dc.html component (template conditionals resolved
  to their defaults: "meet-in-3d" tagline, pill shown, window glow on).

  The floor plan is NOT decoration: it is the hero room's measured floor
  polygon (web/public/hero/room.json, scene ce68e24f) at a uniform ~82 px/m —
  all six wall lengths verified within 0.7% of the same scale, the window
  drawn at its real 56–90% span of its wall, and "3.02 m" derived from that
  wall's true length (3.0233 m). If the geometry ever changes, re-derive; do
  not invent numbers.

  Re-export (exactly 1200×630) with headless Chrome:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --force-device-scale-factor=1 \
      --virtual-time-budget=10000 \
      --screenshot=web/public/og-card.png docs/product/og-card.html

  Re-export triggers: a copy change, or the identity changing. The eyebrow is
  generated — tools/gen_mark.py's SVG pasted inline, because this file has no
  build step to import it, and tools/test_gen_mark.py fails if the two stop
  matching. The eyebrow carries the MARK and never the mark beside the name:
  the mark is the "oo" of "the good guest", so a lockup would print those two
  letters twice (see web/src/components/Wordmark.tsx). The domain in the footer
  is the TRUE hosting URL rather than the product name, and stays.
  Alternate tagline kept from the design source: "No photos generated. No feed.
  Your rooms are yours."
-->
