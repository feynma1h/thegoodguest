[project]
name = "roomstudio"
version = "0.0.1"
description = "Spatial intelligence platform"
requires-python = ">=3.11"

# This root project doesn't ship as a package. It exists to coordinate
# dev tooling across the workspace (linters, formatters, type checkers).
# Each service and package has its own pyproject.toml for runtime deps.
#
# It also owns `tools/`, which is why the dev extra below exists: the root
# suite runs `tools/test_gen_mark.py`, and nothing else in the root job's
# install set declares Pillow. Without it CI dies at COLLECTION with
# ModuleNotFoundError and every other root test goes unrun -- which is what
# happened for five days from 2026-08-21 (punchlist G4-02). numpy is not
# listed because packages/schemas already declares it for pose_math.

[project.optional-dependencies]
dev = [
    # tools/gen_mark.py rasterises the mark; tools/test_gen_mark.py compares
    # the shipped icons against it.
    "pillow>=10",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Verbatim third-party source, vendored as documentation (decision 0264). It is
# never imported and never edited, so linting it produces hundreds of findings
# about code we do not own and cannot change. Excluded from the moment it
# landed: a lint run over the service directory reports 216 errors without this.
extend-exclude = ["services/perception-obj/upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = [
    "packages/schemas/tests",
    "packages/api-core/tests",
    "services/api-internal/tests",
    "services/api-public/tests",
    "tools/test_upload_test_bundle.py",
    "tools/test_smoke_test_e2e.py",
    "tools/test_backfill_scene_expiry.py",
    "tools/test_gen_mark.py",
    "tools/test_upstream_hook.py",
]
addopts = "--import-mode=importlib"
