[project]
name = "roomstudio"
version = "0.0.1"
description = "Spatial intelligence platform"
requires-python = ">=3.11"

# This root project doesn't ship as a package. It exists to coordinate
# dev tooling across the workspace (linters, formatters, type checkers).
# Each service and package has its own pyproject.toml for runtime deps.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = [
    "packages/schemas/tests",
    "packages/api-core/tests",
    "services/api-internal/tests",
    "services/api-public/tests",
    "tools/test_upload_test_bundle.py",
    "tools/test_smoke_test_e2e.py",
    "tools/test_backfill_scene_expiry.py",
    "tools/test_gen_mark.py",
    "tools/test_upstream_hook.py",
]
addopts = "--import-mode=importlib"
