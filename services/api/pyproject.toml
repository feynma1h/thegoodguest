[project]
name = "roomstudio-api"
version = "0.1.0"
description = "roomstudio bundle ingester — validates CaptureBundle from GCS, creates a Scene, and dispatches perception work via Cloud Tasks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "google-cloud-storage>=2.10,<3.0",
    "google-cloud-firestore>=2.14,<3.0",
    "google-cloud-tasks>=2.13,<3.0",
    "google-auth>=2.20,<3.0",
    "firebase-admin>=6.3,<7.0",
    # roomstudio-schemas is a local package.
    # Install it first: pip install -e packages/schemas
    "roomstudio-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.25,<1.0",     # required by starlette TestClient (>=0.20)
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No packages to find: this is a flat-module service, not an installable
# library. pyproject.toml exists to declare dependencies for tooling and
# to mark this as a Python project for monorepo navigation.
