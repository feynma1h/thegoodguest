[project]
name = "roomstudio-perception-obj"
version = "0.0.1"
description = "Per-object segmentation (SAM 3) + Gaussian splat reconstruction (SAM 3D Objects)"
requires-python = ">=3.11"

# Runtime deps are installed in the Dockerfile (not via this file) because
# they include heavy ML packages (torch, etc.) that need explicit version
# pinning matched to the CUDA base image. This file exists for editor
# tooling and to mark this as a Python project for monorepo navigation.
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "transformers",
    "huggingface_hub",
    "trimesh",
    "pillow",
    "pillow-heif",
    "numpy<2",
    "einops",
    "safetensors",
    "google-auth>=2.0,<3.0",
    "google-cloud-firestore>=2.14,<3.0",
    "firebase-admin>=6.0,<7.0",
    "thegoodguest-schemas",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.25,<1.0",
]
