[project]
name = "thegoodguest-api-internal"
version = "0.1.0"
description = "thegoodguest internal API — IAM-gated Eventarc handler and legacy ingest endpoint"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "google-cloud-storage>=2.10,<3.0",
    "google-cloud-firestore>=2.14,<3.0",
    "google-cloud-tasks>=2.13,<3.0",
    "google-auth>=2.20,<3.0",
    "firebase-admin>=6.3,<7.0",
    # thegoodguest-schemas and thegoodguest-api-core are local packages.
    # Install them first: pip install -e packages/schemas packages/api-core
    "thegoodguest-schemas",
    "thegoodguest-api-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.25,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No packages to find: flat-module service, not an installable library.
