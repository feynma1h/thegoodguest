[project]
name = "thegoodguest-api-public"
version = "0.1.0"
description = "thegoodguest public API — Firebase-authenticated client endpoints (upload_session)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "firebase-admin>=6.3,<7.0",
    # Conversation stage 1 (decision 0058): the guest model.
    "anthropic>=0.100,<1.0",
    # thegoodguest-schemas and thegoodguest-api-core are local packages.
    # Install them first: pip install -e packages/schemas packages/api-core
    "thegoodguest-schemas",
    "thegoodguest-api-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.25,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No packages to find: flat-module service, not an installable library.
