# Python suites.
#
# THREE JOBS, NOT ONE, and the split is not cosmetic:
#
#   - The root suite's collection set is pinned by `pyproject.toml` testpaths
#     plus the root `conftest.py`, which deliberately EXCLUDE
#     `services/perception-obj/tests` and `tools/test_reenqueue_scene.py`.
#     Those two therefore have to be invoked by path, which is exactly what
#     CLAUDE.md's testpaths note says.
#   - perception-obj declares `numpy<2` to match the environment its image
#     actually builds (torch 2.5.1+cu121 on condaforge/mambaforge, whose SAM 3D
#     stack is on numpy 1.x), while packages/schemas declares `numpy>=1.24` and
#     resolves to 2.x in practice. Installing both in one environment would
#     force one of them off its production version and test a configuration
#     nothing ships.
#
# Dependencies come from `tools/ci_deps.py`, which reads each component's own
# pyproject. The services are flat modules and NOT pip-installable (their
# pyprojects say so); only packages/schemas and packages/api-core are real
# packages and get installed editable.
#
# Deliberately no pass counts in this file. They were stated here once, drifted
# within days of the suites growing, and a stale number in a workflow comment
# reads as a claim about the run you are looking at. The job output is the
# count.

name: python

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production parity: services/api-*/Dockerfile are python:3.11-slim.
  # (Local dev runs 3.14 and the suites pass there too.)
  PYTHON_VERSION: "3.11"

jobs:
  root:
    name: root suite (schemas, api-core, api-internal, api-public, tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(python tools/ci_deps.py \
            packages/schemas/pyproject.toml \
            packages/api-core/pyproject.toml \
            services/api-internal/pyproject.toml \
            services/api-public/pyproject.toml \
            --extra dev)
      - name: Install local packages (editable)
        run: python -m pip install -e packages/schemas -e packages/api-core
      - name: Run root suite
        # testpaths + conftest.py decide collection; no path argument.
        run: python -m pytest -q

  perception:
    name: perception-obj suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install declared dependencies
        # transformers / huggingface_hub / einops / safetensors are declared
        # runtime deps but are DEFERRED imports reached only on the GPU path,
        # which no offline test executes. torch is not declared here at all —
        # it comes from the pytorch base image. Excluding them keeps this job
        # to seconds instead of minutes. If a test ever needs one, this job
        # fails with a plain ImportError, which is the right way to find out.
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(python tools/ci_deps.py \
            services/perception-obj/pyproject.toml --extra dev \
            --exclude transformers --exclude huggingface_hub \
            --exclude einops --exclude safetensors)
          python -m pip install -e packages/schemas
      - name: Run perception suite
        # SETTLED 2026-08-08 — this job WAS the arbiter, and it ruled.
        # test_shell_observation.py::TestMedianSelect::test_closer_frame_outweighs_far
        # raises IndexError ONLY on macOS arm64 with numpy 1.26.4, where numpy
        # links Apple Accelerate. It passes here (Linux/OpenBLAS, same numpy
        # 1.26.4) and on numpy 2.x. The shipping configuration is this one, so
        # there is no production exposure and no code defect to fix.
        #
        # The evidence, because "environment-sensitive" is otherwise a shrug:
        # the failing call's exact inputs were captured and its guard logic
        # replayed line for line 50 times — every replay yields a maximum
        # index of 99 into a 100-row mask, comfortably in bounds, while the
        # real call on those same inputs indexes 100. Same inputs, same code,
        # different outcome. The bounds guard (v <= img_h - 1.001) is provably
        # correct and is not what is wrong. The divide-by-zero/overflow/invalid
        # matmul warnings are misattributed sticky FPU flags, not the cause.
        #
        # Do NOT "fix" this by clamping the indices. Clamping would convert
        # intermittently corrupt numerics into silently corrupt pixels; the
        # crash is the better failure mode. If it ever goes red HERE, that is
        # new information and worth a decision note.
        run: python -m pytest services/perception-obj/tests -q

  reenqueue:
    name: re-enqueue tool suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(python tools/ci_deps.py \
            packages/api-core/pyproject.toml \
            services/api-internal/pyproject.toml --extra dev)
          python -m pip install -e packages/schemas -e packages/api-core
      - name: Run re-enqueue suite
        run: python -m pytest tools/test_reenqueue_scene.py -q

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install ruff
      # NON-GATING, and the backlog is the reason: `ruff check .` reports
      # several hundred errors repo-wide, the large majority auto-fixable `UP`
      # modernisations like `Optional[X]` -> `X | None`, plus two deliberate
      # `assert False` in perception's test_receiver_repo.py. The house rule
      # has been "ruff clean on TOUCHED files", not repo-wide, so gating here
      # would be permanently red and would train everyone to ignore it.
      #
      # To make this gate: run `ruff check --fix .`, review the diff, land it
      # as its own commit, then drop the `|| echo` below. Scoping to changed
      # files instead needs a merge base and is the other reasonable option.
      - run: ruff check . || echo "::warning::ruff reported findings (non-gating; see workflow comment)"
