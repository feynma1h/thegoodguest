[project]
name = "thegoodguest-api-core"
version = "0.1.0"
description = "Shared logic for roomstudio API services — upload session repository and GCS resumable URI minting"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-firestore>=2.14,<3.0",
    "google-auth>=2.20,<3.0",
    # requests is needed by google.auth.transport.requests (used by gcs_mint_resumable_uri);
    # it's a transitive dep of google-cloud-firestore but declared here for clarity.
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# No packages = line needed: setuptools finds thegoodguest_api_core/ automatically.
