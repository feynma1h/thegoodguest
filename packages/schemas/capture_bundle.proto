// roomstudio capture bundle — the contract between the iOS capture app and
// the perception backend.
//
// This file is the source of truth. Generated Python lives in
// `roomstudio_schemas/capture_bundle_pb2.py` (see `tools/gen_proto.sh`);
// generated Swift lives in the iOS app's `Generated/capture_bundle.pb.swift`
// (via SwiftProtobuf's protoc plugin).
//
// Conventions baked in:
//
//   FRAME OF REFERENCE
//     All poses, gravity, and depth are in ARKit's native frame:
//       - right-handed
//       - +Y up
//       - camera looks down -Z in its local frame
//     The iOS client emits ARKit values directly. It does NOT transform.
//     The backend converts to whatever frame downstream models need
//       (e.g. SAM 3D's per-object frame).
//
//   TIMESTAMPS
//     CaptureBundle.started_at_device_us / ended_at_device_us are
//     device-monotonic microseconds (CACurrentMediaTime / mach_absolute_time
//     on iOS), the same clock as ARFrame.timestamp. Frame deltas and
//     capture-window durations are computed entirely within this domain:
//       elapsed_s = (frame.timestamp_us - bundle.started_at_device_us) / 1e6
//     CaptureBundle.started_at_wall_us is wall-clock epoch µs, set once at
//     capture start. Use it for display and cross-device sorting only — not
//     for inter-frame math. See docs/decisions/0013.
//
//   IMAGES AND DEPTH BY REFERENCE, NOT INLINE
//     The bundle is metadata; pixel data lives in GCS. Each `Frame` carries
//     a `rgb_gcs_path` (and optionally `depth_gcs_path`) pointing into the
//     bundle's GCS folder. This keeps the bundle proto < 1 MB even for
//     200-frame captures, and lets each artifact upload independently
//     with its own resumable upload.
//
//   PROTO3, NO REQUIRED, EXPLICIT OPTIONALS
//     proto3 with `optional` on every field that may be absent (LiDAR-only
//     fields, RoomPlan output, etc.). This gives proper presence semantics
//     in both Swift and Python.
//
//   VERSIONING
//     `schema_version` is bumped on every breaking change. Backend must
//     reject bundles whose schema_version it doesn't support, rather than
//     silently misinterpreting fields.

syntax = "proto3";

package roomstudio.capture.v1;

// -----------------------------------------------------------------------------
// Top-level
// -----------------------------------------------------------------------------

message CaptureBundle {
  // Bumped on every breaking change to this file. Backend rejects bundles
  // with an unknown schema_version rather than guessing.
  string schema_version = 1;

  // Stable identifier for this capture, generated client-side (UUIDv4).
  // Also used as the GCS prefix: gs://{bucket}/captures/{bundle_id}/...
  string bundle_id = 2;

  // The user this capture belongs to, for auth/scoping at the orchestrator.
  // Format is whatever the auth layer produces — the Firebase anonymous-auth
  // UID today (see docs/decisions/0036), room to swap later.
  string user_id = 3;

  // Capture device + app version. Useful for backend telemetry, debugging,
  // and tier dispatch (LiDAR-on-Pro vs ARKit-only).
  Device device = 4;

  // Tier this capture was collected as. The client picks based on hardware
  // capability; the backend honors it for routing (which models to run).
  CaptureTier tier = 5;

  // Capture window — device-monotonic clock (same domain as ARFrame.timestamp,
  // i.e. CACurrentMediaTime / mach_absolute_time on iOS). Microseconds since
  // device boot. Use these for duration and frame-offset math; they cannot
  // jump due to NTP or DST. start <= end.
  int64 started_at_device_us = 6;
  int64 ended_at_device_us = 7;

  // Wall-clock microseconds (Unix epoch) at the moment the user pressed start.
  // Set once by the client; use for display ("captured May 25 at 4:32 PM")
  // and cross-device ordering. NOT for inter-frame math — the wall clock can
  // jump mid-capture.
  int64 started_at_wall_us = 11;

  // Frames in capture order. Backend SHOULD NOT assume a fixed framerate;
  // the client selects keyframes by pose delta and discards redundant ones.
  repeated Frame frames = 8;

  // RoomPlan output, if the device produced one. Only set when
  // tier == LIDAR_ROOMPLAN.
  optional RoomPlanModel room_plan = 9;

  // Free-form client annotation. Reserved for fields that don't deserve a
  // schema bump (e.g. "user labeled this room: 'living room'").
  map<string, string> client_notes = 10;

  // ARKit plane anchors — the session's FINAL detected-plane set, serialized
  // once at capture stop (ARKit merges and refines anchors continuously
  // mid-session; only the final set is meaningful). The measured geometry
  // source for the room shell (decision 0066): floor and walls are assembled
  // from these, never inferred. Same world frame as the camera poses — the
  // anchors come from the same ARSession. Bundles from clients that predate
  // plane capture simply carry none; the shell degrades to "unavailable"
  // downstream and the bundle stays valid (additive field, schema_version
  // unchanged).
  repeated PlaneAnchor plane_anchors = 12;
}

// -----------------------------------------------------------------------------
// Device + tier
// -----------------------------------------------------------------------------

message Device {
  // e.g. "iPhone15,3" (iPhone 14 Pro Max). The `hw.machine` value from
  // `sysctlbyname` (NOT `utsname` — see docs/decisions/0028).
  // This is a MODEL string, not a unique device identifier — two phones of
  // the same model produce the same value. Do not use as a device key.
  string hardware_id = 1;

  // e.g. "17.4.1"
  string os_version = 2;

  // e.g. "1.0.3 (42)"
  string app_version = 3;

  // True if the device has a LiDAR sensor (Pro line, iPad Pro).
  bool has_lidar = 4;

  // Stable per-device UUID, generated on first use and persisted in the iOS
  // Keychain (see DeviceIdentity.swift). Distinct from hardware_id (which
  // identifies the model) and from user_id (which identifies the user
  // account). REQUIRED: the backend rejects bundles with an empty device_id
  // as failed_invalid (error code "device_id_missing").
  string device_id = 5;
}

enum CaptureTier {
  CAPTURE_TIER_UNSPECIFIED = 0;
  // ARKit-only. Poses, gravity, intrinsics. No depth, no RoomPlan.
  ARKIT_ONLY = 1;
  // ARKit + LiDAR sceneDepth. Depth is present per frame; RoomPlan is not.
  // (Client may run ARKit alone on a LiDAR device, e.g. if RoomPlan failed.)
  LIDAR_ARKIT = 2;
  // ARKit + LiDAR sceneDepth + RoomPlan parametric model.
  LIDAR_ROOMPLAN = 3;
}

// -----------------------------------------------------------------------------
// Frame
// -----------------------------------------------------------------------------

message Frame {
  // Monotonically increasing per bundle, starting at 0. Used for stable
  // cross-references and ordering after deserialization.
  uint32 frame_index = 1;

  // Device-monotonic microseconds (same clock as CaptureBundle.started_at_device_us /
  // ended_at_device_us and ARFrame.timestamp). Deltas within a bundle are
  // meaningful; comparison across bundles or to wall-clock requires
  // started_at_wall_us as a reference.
  int64 timestamp_us = 2;

  // RGB image. Path within the bundle's GCS prefix
  // (e.g. "frames/000123.jpg"), NOT a full gs:// URI — saves bytes and
  // keeps the bundle relocatable.
  string rgb_gcs_path = 3;

  // Camera pose at capture time. World frame is whatever ARKit assigned
  // when the session started (gravity-aligned, origin at session-start
  // device position). Backend can use `gravity` to reorient if needed.
  Pose camera_pose = 4;

  // Camera intrinsics at this frame. iPhone main cameras don't change
  // intrinsics mid-session in practice, but ARKit reports them per frame
  // and we carry that through — cheaper than asserting it's constant.
  Intrinsics intrinsics = 5;

  // Gravity vector. Always set on ARKit captures.
  Gravity gravity = 6;

  // LiDAR depth + confidence. Set iff Device.has_lidar and the client chose
  // to include depth for this frame (it may downsample depth-frame rate
  // independently of RGB to control bundle size).
  optional Depth depth = 7;

  // Reserved: per-frame ARKit feature points / mesh anchors. Add when the
  // backend can actually consume them.
  reserved 8, 9, 10;
}

// -----------------------------------------------------------------------------
// Geometry primitives
// -----------------------------------------------------------------------------

// Rigid pose: position + unit quaternion, world_from_camera.
//
// Semantics:
//   - position is the camera origin expressed in world coordinates, meters.
//   - rotation is a unit quaternion that rotates camera-local vectors into
//     world coordinates. I.e. for a point p_cam in the camera's local frame,
//       p_world = position + rotate(rotation, p_cam)
//
// Conventions:
//   - Quaternion component order: (x, y, z, w). This matches ARKit's
//     simd_quatf, glTF, Unity, and ARCore. Eigen uses (w, x, y, z) and is the
//     odd one out — converters live at the language boundary, not in the wire.
//   - Unit norm: ||(x,y,z,w)|| must be within 1e-3 of 1. Backend rejects
//     bundles violating this.
//   - World frame is ARKit-native (right-handed, +Y up, camera looks down -Z
//     in its local frame). See the file header for the full convention.
//
// Why pos+quat (not a 4x4 matrix):
//   - 7 floats vs 16 — ~56% smaller per pose on the wire.
//   - Single, cheap validity check (unit norm) vs three matrix checks
//     (orthogonal columns, unit length, det = +1).
//   - Native form for both ARKit (ARAnchor decomposes to pos + quat) and
//     ARCore (Pose IS pos + quat). No cross-platform conversion asymmetry.
//   - Slerp-friendly if temporal smoothing is ever added.
message Pose {
  // Camera origin in world coordinates, meters.
  float pos_x = 1;
  float pos_y = 2;
  float pos_z = 3;
  // Unit quaternion, (x, y, z, w) order. Rotates camera-local vectors into
  // world coordinates.
  float quat_x = 4;
  float quat_y = 5;
  float quat_z = 6;
  float quat_w = 7;
}

// Pinhole intrinsics. ARKit returns a 3x3 matrix; we flatten to fx/fy/cx/cy
// plus image size for clarity and downstream-friendliness. No distortion
// fields: ARKit reports undistorted frames. If a future capture path adds
// distortion (e.g. ultrawide), bump schema_version and add a oneof.
message Intrinsics {
  float fx = 1;
  float fy = 2;
  float cx = 3;
  float cy = 4;
  // Pixel dimensions of the RGB frame this intrinsics describes.
  uint32 width = 5;
  uint32 height = 6;
}

// Gravity in the camera's local frame at the moment of this frame.
// Unit vector. ARKit native is "-Y is down in world" but we resolve gravity
// into camera-local so downstream code never has to apply the pose just to
// know which way is down for this image.
message Gravity {
  float x = 1;
  float y = 2;
  float z = 3;
}

// LiDAR depth map for one frame. Stored as a separate float32 raster in
// GCS; this message just points to it and carries the metadata needed to
// interpret it.
message Depth {
  // Path within the bundle GCS prefix, e.g. "depth/000123.f32".
  // The blob MUST be width*height float32 values, row-major, in meters,
  // with NaN for invalid pixels.
  string depth_gcs_path = 1;

  // Confidence raster, optional. Same shape, uint8, 0=low / 1=med / 2=high,
  // matching ARKit's ARConfidenceLevel.
  optional string confidence_gcs_path = 2;

  uint32 width = 3;
  uint32 height = 4;

  // Depth raster's intrinsics — usually a downscale of the RGB frame's,
  // since ARKit's sceneDepth is 256x192 while RGB is e.g. 1920x1440.
  Intrinsics intrinsics = 5;
}

// -----------------------------------------------------------------------------
// Plane anchors (room shell geometry source — decision 0066)
// -----------------------------------------------------------------------------

// One detected ARKit plane (ARPlaneAnchor), serialized at capture stop.
//
// Frame semantics:
//   - `pose` is world_from_anchor (the Pose message reused with "anchor" in
//     place of "camera": p_world = position + rotate(rotation, p_anchor)).
//   - The plane lies in the anchor's local X-Z plane; anchor-local +Y is the
//     plane normal. For HORIZONTAL planes the normal is world ±Y; for
//     VERTICAL planes it points out of the wall.
//   - `center_*` is ARPlaneAnchor.center: the plane's center in ANCHOR
//     space. The anchor origin drifts off-center as ARKit grows the plane,
//     so the center is NOT the anchor origin.
//   - `extent_width` / `extent_height` are ARPlaneExtent.width/.height
//     (meters): the detected extent of the plane along the extent
//     rectangle's own axes. `rotation_on_y_rad` is
//     ARPlaneExtent.rotationOnYAxis: the rotation of that rectangle around
//     the anchor's +Y, applied about the plane center. Detected extent only
//     — consumers must not extrapolate beyond it.
message PlaneAnchor {
  // world_from_anchor. Same world frame and conventions as Frame.camera_pose.
  Pose pose = 1;

  // Plane center in anchor space, meters (ARPlaneAnchor.center).
  float center_x = 2;
  float center_y = 3;
  float center_z = 4;

  // Detected extent, meters (ARPlaneExtent.width / .height).
  float extent_width = 5;
  float extent_height = 6;

  // Rotation of the extent rectangle around anchor-local +Y, radians
  // (ARPlaneExtent.rotationOnYAxis).
  float rotation_on_y_rad = 7;

  // Horizontal (floor/table/ceiling) vs vertical (wall/door/window).
  PlaneAlignment alignment = 8;

  // ARKit's plane classification, verbatim (e.g. "wall", "floor",
  // "ceiling", "table", "seat", "window", "door"). Empty when the device
  // doesn't classify (pre-A12) or ARKit reports none — consumers treat
  // empty as "unclassified", never guess.
  string classification = 9;

  // Optional anchor-space boundary polygon: ARPlaneGeometry.boundaryVertices
  // projected onto the plane, flattened as (x, z) pairs
  // [x0, z0, x1, z1, ...]. Even length; empty when the client omits it.
  repeated float boundary_xz = 10;
}

enum PlaneAlignment {
  PLANE_ALIGNMENT_UNSPECIFIED = 0;
  HORIZONTAL = 1;
  VERTICAL = 2;
}

// -----------------------------------------------------------------------------
// RoomPlan output (LiDAR-Pro tier only)
// -----------------------------------------------------------------------------

message RoomPlanModel {
  // The exported `CapturedRoom` USDZ in GCS, e.g. "roomplan/room.usdz".
  string usdz_gcs_path = 1;

  // RoomPlan API version at capture time, e.g. "iOS17.4-RoomPlan2".
  // Carry it so we can re-parse correctly if Apple changes the schema.
  string roomplan_version = 2;

  // Optional flat summary, useful for the orchestrator to dispatch without
  // having to crack open the USDZ. NOT a substitute for the USDZ itself —
  // the USDZ is the source of truth.
  optional RoomPlanSummary summary = 3;
}

message RoomPlanSummary {
  uint32 wall_count = 1;
  uint32 door_count = 2;
  uint32 window_count = 3;
  // Furniture boxes as detected by RoomPlan. Categories are RoomPlan's
  // fixed set (chair, sofa, bed, table, storage, fireplace, sink, toilet,
  // dishwasher, oven, ...).
  repeated RoomPlanObject objects = 4;
}

message RoomPlanObject {
  // RoomPlan category string, verbatim.
  string category = 1;
  // Axis-aligned bbox center in world frame, meters.
  float center_x = 2;
  float center_y = 3;
  float center_z = 4;
  // Bbox extent (full width/height/depth, not half), meters.
  float extent_x = 5;
  float extent_y = 6;
  float extent_z = 7;
  // Yaw around +Y, radians. RoomPlan boxes are gravity-aligned, so only
  // one rotation DoF is meaningful.
  float yaw_rad = 8;
}
